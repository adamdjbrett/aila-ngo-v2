404 = "404.html"

# ---------------------------------------------------------------------------
# Cache-Control
#
# The `on` patterns below are mutually exclusive by construction, so no path
# can pick up two different cache-control values regardless of rule order.
# Content-hashed files get `immutable`; anything served from a stable URL that
# changes in place must revalidate.
# ---------------------------------------------------------------------------

# Eleventy bundles carry a content hash in the filename, so a changed file is
# always a changed URL. Safe to cache forever.
[[headers]]
name = "cache-control"
value = "public, max-age=31536000, immutable"
on = "^/assets/bundle/"

# Font filenames are version-stamped (e.g. red-hat-display-v7-latin-900.woff2).
[[headers]]
name = "cache-control"
value = "public, max-age=31536000, immutable"
on = "^/assets/fonts/"

# Responsive derivatives are content-hashed by eleventy-img; source images and
# OG cards are stable in practice. Long TTL, revalidate in the background.
[[headers]]
name = "cache-control"
value = "public, max-age=2592000, stale-while-revalidate=31536000"
on = "^/assets/(images|og-images)/"

[[headers]]
name = "cache-control"
value = "public, max-age=2592000, stale-while-revalidate=31536000"
on = "^/assets/documents/"

# Vendored components and page scripts are NOT hashed — they change under the
# same URL on upgrade, so they get a short TTL rather than `immutable`.
[[headers]]
name = "cache-control"
value = "public, max-age=86400, stale-while-revalidate=604800"
on = "^/assets/(components|scripts)/"

# Pagefind's index and fragment chunks are content-hashed.
[[headers]]
name = "cache-control"
value = "public, max-age=31536000, immutable"
on = "^/pagefind/(index|fragment)/"

# ...but pagefind.js, pagefind-ui.js, pagefind-entry.json and the wasm blobs
# all change in place on upgrade. Caching these `immutable` (as this file
# previously did for the whole /pagefind/ tree) serves stale search for a year.
[[headers]]
name = "cache-control"
value = "public, max-age=0, must-revalidate"
on = "^/pagefind/[^/]+$"

# HTML must always revalidate so visitors pick up new hashed asset URLs.
[[headers]]
name = "cache-control"
value = "public, max-age=0, must-revalidate"
on = "(/|\\.html)$"

# Per-post JSON-LD, served with the right type so Zotero and other harvesters
# recognise it. Previously emitted via a Netlify-format _headers file that this
# deploy never read.
[[headers]]
name = "content-type"
value = "application/ld+json"
on = "metadata\\.json$"

# ---------------------------------------------------------------------------
# Security headers
#
# These were previously defined only in netlify.toml and vercel.json, neither
# of which this deploy reads — so the live site was serving none of them.
# ---------------------------------------------------------------------------

[[headers]]
name = "content-security-policy"
value = "upgrade-insecure-requests;"
on = "^/"

[[headers]]
name = "x-content-type-options"
value = "nosniff"
on = "^/"

[[headers]]
name = "x-frame-options"
value = "DENY"
on = "^/"

[[headers]]
name = "referrer-policy"
value = "strict-origin-when-cross-origin"
on = "^/"

[[headers]]
name = "permissions-policy"
value = "autoplay=(), camera=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), publickey-credentials-get=()"
on = "^/"

