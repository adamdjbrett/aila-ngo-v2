name: Deploy Eleventy to XMIT

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-xmit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      XMIT_PRIMARY_SITE: aila.ngo
      XMIT_PARALLEL_SITE: aila.ong
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # Keyed on the image sources themselves: the previous key hashed
      # package-lock.json, which never changes when an image is added and
      # needlessly discarded the cache whenever a dependency moved.
      - name: Restore Eleventy image cache
        uses: actions/cache@v6
        with:
          path: .cache/@11ty/img
          key: eleventy-images-${{ runner.os }}-${{ hashFiles('src/assets/images/**') }}
          restore-keys: eleventy-images-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Eleventy site
        run: npm run build
        env:
          URL: https://${{ env.XMIT_PRIMARY_SITE }}

      - name: Verify build output
        run: |
          if [ ! -f dist/index.html ] || [ ! -f dist/404.html ] || [ ! -f dist/xmit.toml ]; then
            echo "::error::dist is missing required xmit deployment files"
            exit 1
          fi
          grep -q "https://$XMIT_PRIMARY_SITE/" dist/index.html || {
            echo "::error::Production URL is missing from dist/index.html"
            exit 1
          }

      - name: Deploy to XMIT (CLI)
        env:
          XMIT_KEY: ${{ secrets.XMIT_KEY }}
        run: |
          if [ -z "$XMIT_KEY" ]; then
            echo "::error::XMIT_KEY secret is not set"
            exit 1
          fi
          for site in "$XMIT_PRIMARY_SITE" "$XMIT_PARALLEL_SITE"; do
            deployed=false
            echo "Deploying dist to $site on xmit team 389"
            for attempt in 1 2 3; do
              if ./node_modules/.bin/xmit "$site@389" dist; then
                echo "$site deploy succeeded on attempt $attempt"
                deployed=true
                break
              fi
              echo "::warning::$site deploy attempt $attempt failed"
              sleep $((attempt * 15))
            done
            if [ "$deployed" != true ]; then
              echo "::error::$site deploy failed after 3 attempts"
              exit 1
            fi
          done

      - name: Post-deploy summary
        run: |
          echo "Deployed https://$XMIT_PRIMARY_SITE and https://$XMIT_PARALLEL_SITE" >> "$GITHUB_STEP_SUMMARY"
